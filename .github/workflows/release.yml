name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build reference build image
        run: docker build -t embedded-cicd-builder:24.04 .

      - name: Check formatting (clang-format)
        run: ./scripts/format.sh --check

      - name: Static analysis (Cppcheck)
        run: ./scripts/static_analysis.sh

      - name: Build and run unit tests
        run: ./scripts/build_and_test.sh

      - name: Coverage (lcov, minimum 90% of lines)
        env:
          MIN_LINE_COVERAGE: "90"
        run: ./scripts/coverage.sh

      - name: Build runtime image and smoke test
        run: ./scripts/build_runtime_image.sh

      - name: Package release artifacts
        run: |
          mkdir -p dist
          cid="$(docker create embedded-cicd-demo:dev)"
          docker cp "${cid}:/usr/local/bin/signal_demo" dist/signal_demo
          docker rm "${cid}"
          tar -C dist -czf "dist/signal_demo-${GITHUB_REF_NAME}-linux-amd64.tar.gz" signal_demo
          rm dist/signal_demo
          tar -C coverage -czf "dist/coverage-report-${GITHUB_REF_NAME}.tar.gz" html
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" --generate-notes
