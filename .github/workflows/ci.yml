name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Format, static analysis, build, test, coverage and runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build reference build image
        run: docker build -t embedded-cicd-builder:24.04 .

      - name: Check formatting (clang-format)
        run: ./scripts/format.sh --check

      - name: Static analysis (Cppcheck)
        run: ./scripts/static_analysis.sh

      - name: Build and run unit tests
        run: ./scripts/build_and_test.sh

      - name: Coverage (lcov, minimum 90% of lines)
        env:
          MIN_LINE_COVERAGE: "90"
        run: ./scripts/coverage.sh

      - name: Build runtime image and smoke test
        run: ./scripts/build_runtime_image.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
